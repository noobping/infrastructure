# Create exact bind-mount roots before the policy containers start. Ansible
# owns service metadata below these roots; tmpfiles leaves that metadata alone.
d /var/lib/clamav - - - -
d /var/log/clamav - - - -
d /run/clamd.scan - - - -
d /var/lib/suricata - - - -
d /var/log/suricata - - - -
d /var/lib/gssproxy - - - -

# ClamAV scan roots are host facilities, prepared without broad policy mounts.
d /run/media 0755 root root -
d /var/home 0755 root root -
d /var/mnt 0755 root root -
d /var/opt 0755 root root -
d /var/srv 0755 root root -
d /var/usrlocal 0755 root root -
d /var/roothome 0700 root root -
d /tmp 1777 root root -
d /var/tmp 1777 root root -
