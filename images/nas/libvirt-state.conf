# /var is persistent state, not populated from the bootable image's RPM tree.
# Create and label daemon directories before libvirt starts on the first boot.
d /var/lib/libvirt 0755 root root -
d /var/lib/libvirt/images 0755 root root -
d /var/lib/libvirt/qemu 0755 qemu qemu -
d /var/log/libvirt 0755 root root -
d /var/log/libvirt/qemu 0755 root root -
