name: Run Pipeline on the host
description: Prepare a GitHub runner and execute a named infrastructure pipeline

inputs:
  arguments:
    description: Pipeline arguments, one argument per line
    required: true

runs:
  using: composite
  steps:
    - name: Install host build tools
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          buildah ca-certificates curl fuse-overlayfs git jq podman python3 \
          skopeo slirp4netns uidmap xorriso
        sudo update-ca-certificates

    - name: Configure container storage
      shell: bash
      run: |
        set -euo pipefail
        sudo mkdir -p /mnt/containers /mnt/runcontainers /mnt/tmp
        sudo chown -R "$USER:$USER" \
          /mnt/containers /mnt/runcontainers /mnt/tmp
        mkdir -p "$HOME/.config/containers"
        tee "$HOME/.config/containers/storage.conf" >/dev/null <<'EOF'
        [storage]
        driver = "overlay"
        runroot = "/mnt/runcontainers/storage"
        graphroot = "/mnt/containers/storage"

        # Native overlay avoids RPM SQLite corruption with older fuse-overlayfs.
        # https://github.com/containers/fuse-overlayfs/issues/475
        [storage.options.overlay]
        mount_program = ""
        EOF
        storage_info="$(buildah info)"
        printf '%s\n' "$storage_info"
        if ! jq -e '
          .store.GraphDriverName == "overlay" and
          all(.store.GraphOptions[]?; test("mount_program=.") | not)
        ' <<< "$storage_info" >/dev/null; then
          echo "Native overlay storage is required for RPM image builds." >&2
          exit 1
        fi
        podman --version

    - name: Run Pipeline
      shell: bash
      env:
        PIPELINE_ARGUMENTS: ${{ inputs.arguments }}
        PIPELINE_PULL: newer
        TMPDIR: /mnt/tmp
      run: |
        set -euo pipefail
        arguments=()
        while IFS= read -r argument || [[ -n "$argument" ]]; do
          argument=${argument%$'\r'}
          [[ -z "$argument" ]] && continue
          arguments+=("$argument")
        done < <(printf '%s' "$PIPELINE_ARGUMENTS")

        source "$GITHUB_WORKSPACE/images/nas/pipeline.sh"
        pipeline "${arguments[@]}"
