name: Check

on:
  push: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Policy fixtures (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pipeline
        with:
          arguments: test-policy

  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check with Pipeline
        uses: ./.github/actions/pipeline
        with:
          arguments: |
            --cap-jobs
            3
            check
